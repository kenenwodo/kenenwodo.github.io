# ── Site settings ────────────────────────────────────────────────
title            : "Kenechukwu (Kene) Nwodo"
name             : "Kenechukwu Nwodo"
description      : "Computer Engineering Ph.D. Candidate at Virginia Tech, researching agentic AI for autonomous cyber defense and LLM-driven vulnerability management."
url              : "https://kenenwodo.github.io"
baseurl          : ""
repository       : "kenenwodo/kenenwodo.github.io"

# ── Profile (rendered in the left rail) ──────────────────────────
profile:
  name          : "Kenechukwu (Kene) Nwodo"
  tagline       : "Ph.D. Candidate at Virginia Tech"
  photo         : "/images/kene_profile.jpg"
  location      : "Arlington, Virginia, USA"
  email         : "nwodok@vt.edu"
  linkedin      : "https://www.linkedin.com/in/kenechukwunwodo"
  scholar       : "https://scholar.google.com/citations?user=yLF-_98AAAAJ&hl=en"
  github        : "https://github.com/kenenwodo"

# ── Build ────────────────────────────────────────────────────────
markdown         : kramdown
permalink        : /:categories/:title/
timezone         : America/New_York
future           : true

include:
  - _pages

collections:
  publications:
    output: false
  research:
    output: false
  talks:
    output: false
  posters:
    output: false
  service:
    output: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - README.md
  - node_modules
